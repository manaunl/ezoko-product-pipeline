name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Same reasoning as the release workflow: macOS is the only platform this
    # runs on, and the launcher tests exercise BSD-specific behaviour.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - run: npm run test:launcher
      - run: npm run test:update
